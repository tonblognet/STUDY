name: CI
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postupai_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postupai_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postupai_test -d postupai_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postupai_test:local-test-only@127.0.0.1:5432/postupai_ci_test
      CATALOG_STORAGE: snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm security:audit
      - name: Restore isolated PostgreSQL archive and verify invariants
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          node --test scripts/restore-drill.test.mjs
          RESTORE_DRILL_PG_BIN=/usr/lib/postgresql/16/bin node --import tsx scripts/restore-drill.mjs
      - name: Validate catalog candidate and dry-run import
        run: |
          pnpm data:validate
          pnpm data:import -- --dry-run
      - name: Check accessibility evidence contract
        run: node --test scripts/public-accessibility-contract.test.mjs
      - name: Install pinned browser CLI outside the repository
        run: npm install --prefix "$RUNNER_TEMP/postupai-browser" --no-audit --no-fund --save-exact @playwright/cli@0.1.23 axe-core@4.14.0
      - name: Check catalog, SSR smoke and public accessibility
        env:
          APP_URL: http://127.0.0.1:3100
          PORT: 3100
          HOSTNAME: 127.0.0.1
        run: |
          mkdir -p output/playwright
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100 > output/playwright/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          BROWSER_CLI="$RUNNER_TEMP/postupai-browser/node_modules/@playwright/cli/playwright-cli.js" node scripts/test-catalog-browser.mjs
          node scripts/staging-smoke.mjs --local http://127.0.0.1:3100 --rounds=10 > output/playwright/ssr-smoke.json
          BROWSER_CLI="$RUNNER_TEMP/postupai-browser/node_modules/@playwright/cli/playwright-cli.js" AXE_CORE_PATH="$RUNNER_TEMP/postupai-browser/node_modules/axe-core/axe.min.js" node scripts/test-public-accessibility.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-browser-${{ github.run_id }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14
  container:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postupai_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postupai_container_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postupai_test -d postupai_container_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROLE_FIXTURE_MIGRATE_URL: postgresql://ci_role_migrate:role-fixture-migrate-only@127.0.0.1:5432/postupai_container_test?schema=postupai_roles
      ROLE_FIXTURE_WEB_URL: postgresql://ci_role_web:role-fixture-web-only@127.0.0.1:5432/postupai_container_test?schema=postupai_roles
      ROLE_FIXTURE_WORKER_URL: postgresql://ci_role_worker:role-fixture-worker-only@127.0.0.1:5432/postupai_container_test?schema=postupai_roles
      ROLE_FIXTURE_OPERATOR_URL: postgresql://ci_role_operator:role-fixture-operator-only@127.0.0.1:5432/postupai_container_test?schema=postupai_roles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build isolated migration, web and worker artifacts
        run: |
          mkdir -p tmp output .codex .claude context-fixture/.claude context-fixture/.codex
          touch tmp/container-context-sentinel output/container-context-sentinel .codex/container-context-sentinel .env.container-context-sentinel .claude/settings.local.json context-fixture/.claude/session.json context-fixture/.codex/session.json
          docker build --target migrate --tag postupai-migrate:ci .
          docker build --target runner --tag postupai-web:ci .
          docker build --target worker --tag postupai-worker:ci .
          for image in postupai-migrate:ci postupai-web:ci postupai-worker:ci; do
            docker run --rm --entrypoint node "$image" -e 'const fs = require("node:fs"); for (const p of ["/app/tmp/container-context-sentinel", "/app/output/container-context-sentinel", "/app/.codex", "/app/.env.container-context-sentinel", "/app/.claude", "/app/context-fixture/.claude", "/app/context-fixture/.codex"]) if (fs.existsSync(p)) throw Error("Forbidden build-context file");'
            test "$(docker run --rm --entrypoint id "$image" -u)" -ne 0
          done
      - name: Apply migrations with a dedicated schema owner
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          db_fixture() {
            docker exec -i "$POSTGRES_SERVICE_ID" psql -U postupai_test -d postupai_container_test -v ON_ERROR_STOP=1 "$@" < tests/container-db-roles.sql
          }
          db_fixture -v prepare_roles=1
          docker run --rm --network host --env DATABASE_URL="$ROLE_FIXTURE_MIGRATE_URL" postupai-migrate:ci
          db_fixture -v grant_runtime=1
      - name: Verify role permissions, bootstrap and a due reminder
        run: |
          docker run --rm --network host --env ROLE_FIXTURE_WEB_URL --env ROLE_FIXTURE_WORKER_URL --env ROLE_FIXTURE_OPERATOR_URL --entrypoint node postupai-migrate:ci --import tsx tests/container-db-roles.mjs
      - name: Run isolated worker and inspect heartbeat
        run: |
          docker run --rm --read-only --network host --tmpfs /tmp --env DATABASE_URL="$ROLE_FIXTURE_WORKER_URL" --env DEPLOYMENT_MODE=staging --env CATALOG_STORAGE=database --env DEADLINE_EMAIL_ENABLED=false postupai-worker:ci node --import tsx scripts/deadline-worker.ts --once
          docker run --rm --read-only --network host --tmpfs /tmp --env DATABASE_URL="$ROLE_FIXTURE_WORKER_URL" --env DEPLOYMENT_MODE=staging --env CATALOG_STORAGE=database postupai-worker:ci node --import tsx scripts/deadline-worker.ts --status
      - name: Start standalone artifact with test configuration
        run: |
          docker run --detach --name postupai-container-smoke --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /app/.next/cache:uid=1000,gid=1000,mode=0750 \
            --env PORT=3101 --env HOSTNAME=127.0.0.1 \
            --env DATABASE_URL="$ROLE_FIXTURE_WEB_URL" --env CATALOG_STORAGE=database \
            --env DEPLOYMENT_MODE=staging \
            --env APP_URL=http://127.0.0.1:3101 \
            --env AUTH_SECRET=container-fixture-secret-at-least-32-characters \
            --env SMTP_URL=smtp://127.0.0.1:1 --env EMAIL_FROM=fixture@example.invalid \
            postupai-web:ci
          node tests/container-smoke.mjs
      - name: Container diagnostics on failure
        if: failure()
        run: docker logs postupai-container-smoke 2>/dev/null || true
      - name: Remove isolated web container
        if: always()
        run: docker rm --force postupai-container-smoke 2>/dev/null || true
