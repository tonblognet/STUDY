name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postupai_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postupai_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postupai_test -d postupai_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postupai_test:local-test-only@127.0.0.1:5432/postupai_ci_test
      CATALOG_STORAGE: snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm security:audit
