name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build static-compatible server
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_FULL_SITE_URL: https://postupai-2026.exman101.chatgpt.site
          NEXT_PUBLIC_SITE_URL: https://tonblognet.github.io/STUDY/
      - name: Export static pages
        shell: bash
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_FULL_SITE_URL: https://postupai-2026.exman101.chatgpt.site
          NEXT_PUBLIC_SITE_URL: https://tonblognet.github.io/STUDY/
        run: |
          pnpm start > /tmp/postupai-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          pnpm pages:export
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
