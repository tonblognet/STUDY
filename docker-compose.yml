services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postupai
      POSTGRES_PASSWORD: postupai
      POSTGRES_DB: postupai
    ports: ["5432:5432"]
    volumes: ["postupai_pg:/var/lib/postgresql/data"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U postupai"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  postupai_pg:
